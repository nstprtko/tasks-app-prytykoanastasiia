version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
          
  - package-ecosystem: "pip"
    directories: ["/services/tasks-api", "/services/title-normalizer"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3