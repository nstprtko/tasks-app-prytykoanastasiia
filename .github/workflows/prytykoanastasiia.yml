name: Test and Scan
on: 
  push:
    branches: [main]
permissions:
    contents: read
jobs:
    run_tests:
      runs-on: ubuntu-latest
      strategy: 
        fall-fast: false
        matrix:
          service: [tasks-api, title-normalizer]
          python-version: [3.12, 3.11, 3.8]
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: ${{matrix.python-version}}
        - run: pip install -r services/${{matrix.service}}/requirements.txt
        - run: pytest services/${{matrix.service}}
        - shell: bash 
          run: pytest -rA services/${{matrix.service}} | tee ${{matrix.service}}-test-report.txt
        - uses: actions/upload-artidact@v7
          if: always()
          with:
            name: ${{matrix.service}}-test-report
            path: ${{matrix.service}}-test-report.txt